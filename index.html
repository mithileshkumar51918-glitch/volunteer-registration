<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volunteer Registration System</title>
    <style>
/* Base Styles */
:root {
    --primary-color: #0056b3;
    --secondary-color: #f4f7f6;
    --text-color: #333;
    --border-color: #ddd;
    --success: #28a745;
    --warning: #ffc107;
    --danger: #dc3545;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background-color: var(--secondary-color);
    color: var(--text-color);
}

/* Header */
header {
    background-color: var(--primary-color);
    color: white;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* Layout */
main {
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
}

.hidden {
    display: none !important;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-top: 1rem;
}

/* Cards & Forms */
.card {
    background: white;
    padding: 1.5rem;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.login-card {
    max-width: 400px;
    margin: 0 auto;
}

.mt-2 {
    margin-top: 2rem;
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: bold;
}

.form-group input, .form-group select, .form-group textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
}

/* Buttons */
.btn {
    background-color: var(--primary-color);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    cursor: pointer;
    border-radius: 4px;
    font-size: 1rem;
}

.btn:hover { background-color: #004494; }

.btn-logout {
    background-color: var(--danger);
    border: none;
    color: white;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    border-radius: 4px;
}

.btn-small {
    padding: 0.3rem 0.6rem;
    font-size: 0.9rem;
    margin-right: 0.5rem;
}

.btn-success { background-color: var(--success); color: white; border: none;}
.btn-danger { background-color: var(--danger); color: white; border: none;}

/* Lists & Items */
.list-item {
    border: 1px solid var(--border-color);
    padding: 1rem;
    margin-bottom: 1rem;
    border-radius: 4px;
}

.list-item h4 { margin-bottom: 0.5rem; color: var(--primary-color); }
.status-badge {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    border-radius: 3px;
    font-size: 0.8rem;
    font-weight: bold;
    color: white;
}

.status-pending { background-color: var(--warning); color: #333; }
.status-approved { background-color: var(--success); }
.status-rejected { background-color: var(--danger); }

/* Search */
.search-bar {
    margin-bottom: 1rem;
}
.search-bar input {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border-color);
    border-radius: 4px;
}

/* Responsive */
@media (max-width: 768px) {
    .dashboard-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>
<body>
    <header>
        <h1>Volunteer Registration System</h1>
        <div id="user-info" class="hidden">
            <span id="welcome-msg"></span>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </header>

    <main>
        <!-- LOGIN SECTION -->
        <section id="login-section">
            <div class="card login-card">
                <h2>Login to Dashboard</h2>
                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="username">Name:</label>
                        <input type="text" id="username" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="role">Role:</label>
                        <select id="role">
                            <option value="volunteer">Volunteer</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Login</button>
                </form>
            </div>
        </section>

        <!-- ADMIN DASHBOARD -->
        <section id="admin-section" class="hidden">
            <h2>Admin Dashboard</h2>
            
            <div class="dashboard-grid">
                <!-- Manage Events -->
                <div class="card">
                    <h3>Create New Event</h3>
                    <form id="event-form" onsubmit="handleCreateEvent(event)">
                        <div class="form-group">
                            <label>Event Title:</label>
                            <input type="text" id="event-title" required>
                        </div>
                        <div class="form-group">
                            <label>Date:</label>
                            <input type="date" id="event-date" required>
                        </div>
                        <div class="form-group">
                            <label>Description:</label>
                            <textarea id="event-desc" required></textarea>
                        </div>
                        <button type="submit" class="btn">Add Event</button>
                    </form>
                </div>

                <div class="card">
                    <h3>All Events (CRUD)</h3>
                    <div id="admin-events-list"></div>
                </div>
            </div>

            <!-- Manage Applications -->
            <div class="card mt-2">
                <h3>Volunteer Registrations Workflow</h3>
                <div id="admin-applications-list"></div>
            </div>
        </section>

        <!-- VOLUNTEER DASHBOARD -->
        <section id="volunteer-section" class="hidden">
            <h2>Volunteer Dashboard</h2>
            
            <div class="dashboard-grid">
                <!-- Available Events -->
                <div class="card">
                    <h3>Available Events</h3>
                    <div class="search-bar">
                        <input type="text" id="search-events" placeholder="Search events..." onkeyup="filterEvents()">
                    </div>
                    <div id="volunteer-events-list"></div>
                </div>

                <!-- My Status Tracking -->
                <div class="card">
                    <h3>My Registrations & Status</h3>
                    <div id="volunteer-applications-list"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
// --- Data Initialization ---
// We use localStorage to act as our database so data persists on refresh.
let events = JSON.parse(localStorage.getItem('vol_events')) || [];
let applications = JSON.parse(localStorage.getItem('vol_applications')) || [];

// Sample events shown the first time the site is opened
if (events.length === 0) {
    events = [
        { id: 's1', title: 'Community Beach Cleanup', date: '2026-11-21', description: 'Join us to clean the local beach. Gloves and bags provided. Meet at the main entrance at 8:00 AM.' },
        { id: 's2', title: 'Blood Donation Camp', date: '2026-11-28', description: 'Help organize donors, manage registration desk and serve refreshments. 9:00 AM to 4:00 PM.' },
        { id: 's3', title: 'Food Distribution Drive', date: '2026-12-05', description: 'Pack and distribute meals to families in need. Volunteers needed for packing and delivery.' },
        { id: 's4', title: 'Tree Plantation Day', date: '2026-12-12', description: 'Plant 500 saplings in the city park. Bring water bottles and wear comfortable clothes.' },
        { id: 's5', title: 'Teach for a Day', date: '2026-12-19', description: 'Spend a day teaching basic English and computer skills to children at the community school.' },
        { id: 's6', title: 'Winter Clothes Collection', date: '2026-12-26', description: 'Collect, sort and distribute warm clothes and blankets to shelters.' }
    ];
    localStorage.setItem('vol_events', JSON.stringify(events));
}
let currentUser = null; // { name: '...', role: '...' }

// --- Authentication & Routing ---
function handleLogin(e) {
    e.preventDefault();
    const name = document.getElementById('username').value.trim();
    const role = document.getElementById('role').value;
    
    if (name === "") {
        alert("Please enter your name.");
        return;
    }

    currentUser = { name, role };
    document.getElementById('welcome-msg').innerText = `Welcome, ${name} (${role})`;
    
    // UI Routing
    document.getElementById('login-section').classList.add('hidden');
    document.getElementById('user-info').classList.remove('hidden');
    
    if (role === 'admin') {
        document.getElementById('admin-section').classList.remove('hidden');
        renderAdminDashboard();
    } else {
        document.getElementById('volunteer-section').classList.remove('hidden');
        renderVolunteerDashboard();
    }
}

function logout() {
    currentUser = null;
    document.getElementById('user-info').classList.add('hidden');
    document.getElementById('admin-section').classList.add('hidden');
    document.getElementById('volunteer-section').classList.add('hidden');
    document.getElementById('login-section').classList.remove('hidden');
    document.getElementById('login-form').reset();
}

// --- Admin Functions (CRUD & Workflow) ---
function handleCreateEvent(e) {
    e.preventDefault();
    
    const title = document.getElementById('event-title').value;
    const date = document.getElementById('event-date').value;
    const desc = document.getElementById('event-desc').value;
    
    const newEvent = {
        id: Date.now().toString(), // Generate unique ID
        title,
        date,
        description: desc
    };
    
    events.push(newEvent);
    saveData();
    document.getElementById('event-form').reset();
    renderAdminDashboard();
    alert("Event created successfully!");
}

function deleteEvent(eventId) {
    if(confirm("Are you sure you want to delete this event?")) {
        events = events.filter(ev => ev.id !== eventId);
        // Also remove associated applications
        applications = applications.filter(app => app.eventId !== eventId);
        saveData();
        renderAdminDashboard();
    }
}

function updateApplicationStatus(appId, newStatus) {
    const appIndex = applications.findIndex(app => app.id === appId);
    if (appIndex !== -1) {
        applications[appIndex].status = newStatus;
        saveData();
        renderAdminDashboard();
    }
}

function renderAdminDashboard() {
    // Render Events List (Read & Delete)
    const eventsContainer = document.getElementById('admin-events-list');
    eventsContainer.innerHTML = '';
    
    if (events.length === 0) {
        eventsContainer.innerHTML = '<p>No events found.</p>';
    } else {
        events.forEach(ev => {
            eventsContainer.innerHTML += `
                <div class="list-item">
                    <h4>${ev.title}</h4>
                    <p><strong>Date:</strong> ${ev.date}</p>
                    <p>${ev.description}</p>
                    <button class="btn btn-small btn-danger mt-2" onclick="deleteEvent('${ev.id}')">Delete Event</button>
                </div>
            `;
        });
    }

    // Render Applications List (Workflow Approval)
    const appsContainer = document.getElementById('admin-applications-list');
    appsContainer.innerHTML = '';
    
    if (applications.length === 0) {
        appsContainer.innerHTML = '<p>No volunteer registrations yet.</p>';
    } else {
        applications.forEach(app => {
            appsContainer.innerHTML += `
                <div class="list-item">
                    <p><strong>Volunteer:</strong> ${app.volunteerName}</p>
                    <p><strong>Event:</strong> ${app.eventTitle}</p>
                    <p><strong>Status:</strong> <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span></p>
                    ${app.status === 'Pending' ? `
                        <div class="mt-2">
                            <button class="btn btn-small btn-success" onclick="updateApplicationStatus('${app.id}', 'Approved')">Approve</button>
                            <button class="btn btn-small btn-danger" onclick="updateApplicationStatus('${app.id}', 'Rejected')">Reject</button>
                        </div>
                    ` : ''}
                </div>
            `;
        });
    }
}

// --- Volunteer Functions (Search, Register, Track) ---
function renderVolunteerDashboard(filterText = '') {
    // Render Available Events (with Search/Filter)
    const eventsContainer = document.getElementById('volunteer-events-list');
    eventsContainer.innerHTML = '';
    
    const filteredEvents = events.filter(ev => 
        ev.title.toLowerCase().includes(filterText.toLowerCase()) || 
        ev.description.toLowerCase().includes(filterText.toLowerCase())
    );

    if (filteredEvents.length === 0) {
        eventsContainer.innerHTML = '<p>No events available.</p>';
    } else {
        filteredEvents.forEach(ev => {
            // Check if user already applied
            const alreadyApplied = applications.find(app => app.eventId === ev.id && app.volunteerName === currentUser.name);
            
            eventsContainer.innerHTML += `
                <div class="list-item">
                    <h4>${ev.title}</h4>
                    <p><strong>Date:</strong> ${ev.date}</p>
                    <p>${ev.description}</p>
                    ${alreadyApplied 
                        ? `<p class="mt-2" style="color: green; font-weight: bold;">✓ Already Applied</p>` 
                        : `<button class="btn btn-small mt-2" onclick="applyForEvent('${ev.id}', '${ev.title}')">Register as Volunteer</button>`
                    }
                </div>
            `;
        });
    }

    // Render My Applications (Status Tracking)
    const myAppsContainer = document.getElementById('volunteer-applications-list');
    myAppsContainer.innerHTML = '';
    
    const myApplications = applications.filter(app => app.volunteerName === currentUser.name);
    
    if (myApplications.length === 0) {
        myAppsContainer.innerHTML = '<p>You have not registered for any events yet.</p>';
    } else {
        myApplications.forEach(app => {
            myAppsContainer.innerHTML += `
                <div class="list-item">
                    <h4>${app.eventTitle}</h4>
                    <p><strong>Status:</strong> <span class="status-badge status-${app.status.toLowerCase()}">${app.status}</span></p>
                </div>
            `;
        });
    }
}

function filterEvents() {
    const searchText = document.getElementById('search-events').value;
    renderVolunteerDashboard(searchText);
}

function applyForEvent(eventId, eventTitle) {
    const newApp = {
        id: Date.now().toString(),
        eventId: eventId,
        eventTitle: eventTitle,
        volunteerName: currentUser.name,
        status: 'Pending' // Workflow validation starts as pending
    };
    
    applications.push(newApp);
    saveData();
    renderVolunteerDashboard();
    alert(`Successfully registered for ${eventTitle}! Waiting for admin approval.`);
}

// --- Utility Functions ---
function saveData() {
    localStorage.setItem('vol_events', JSON.stringify(events));
    localStorage.setItem('vol_applications', JSON.stringify(applications));
}

</script>
</body>
</html>
